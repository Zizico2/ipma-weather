name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The runner image already has Chromium's shared libraries. --with-deps
      # also apt-installs extra fonts, and that fails when Ubuntu archive DNS blips.
      - run: bunx playwright install chromium
      - run: bun run test:e2e:production
      - name: Build against the deterministic gRPC fixture
        env:
          IPMA_GRPC_URL: http://127.0.0.1:50061
          IPMA_PUBLIC_DATA_GRPC_URL: http://127.0.0.1:50061
        run: |
          node --import tsx tests/fixtures/grpc-server.ts &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          node --input-type=module -e 'import {connect} from "net"; for (let i=0;i<50;i++) { if (await new Promise(r=>{const s=connect(50061,"127.0.0.1");s.on("connect",()=>{s.destroy();r(true)});s.on("error",()=>r(false))})) process.exit(0); await new Promise(r=>setTimeout(r,100)); } process.exit(1)'
          bun run build
          bun run check:client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
