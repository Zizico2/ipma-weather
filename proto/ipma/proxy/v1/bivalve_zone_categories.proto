syntax = "proto3";

package ipma.proxy.v1;

import "ipma/proxy/v1/bivalve_region_value.proto";
import "ipma/proxy/v1/bivalve_species_permission.proto";
import "ipma/proxy/v1/bivalve_zone_status_value.proto";
import "ipma/proxy/v1/bivalve_zone_type_value.proto";
import "ipma/proxy/v1/bivalve_zone_value.proto";

// Typed companion to bivalve feature properties; original properties remain in Geobuf.
// The zone wrapper source_value retains the source code/samp token.
message BivalveZoneCategories {
  BivalveZoneValue zone = 1;
  BivalveZoneTypeValue zone_type = 2;
  BivalveZoneStatusValue status = 3;
  BivalveRegionValue region = 4;
  repeated BivalveSpeciesPermission species_permissions = 5;
}
