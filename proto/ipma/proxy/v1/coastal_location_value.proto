syntax = "proto3";

package ipma.proxy.v1;

import "ipma/proxy/v1/coastal_location.proto";

// Absent source values omit this message. OTHER retains its source identity.
message CoastalLocationValue {
  CoastalLocation value = 1;
  // Exact original source representation, including unfamiliar values.
  uint32 source_code = 2;
}
