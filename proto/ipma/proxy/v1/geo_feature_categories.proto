syntax = "proto3";

package ipma.proxy.v1;

import "ipma/proxy/v1/bivalve_zone_categories.proto";
import "ipma/proxy/v1/station_reference.proto";

// Optional typed sidecar; each entry refers to exactly one original feature.
// Feature order and all original Geobuf properties must remain unchanged.
// Older servers may omit entries; omission does not mean a source value is absent.
message GeoFeatureCategories {
  // Zero-based index into decoded Geobuf FeatureCollection.features. Do not join
  // on a feature ID: the source may omit IDs or repeat them. Zero is valid.
  uint32 feature_index = 1;
  oneof categories {
    // Station catalogue and recent-observation features.
    StationReference station = 2;
    BivalveZoneCategories bivalve_zone = 3;
  }
}
