syntax = "proto3";

package ipma.proxy.v1;

import "google/protobuf/timestamp.proto";
import "ipma/proxy/v1/coastal_location_value.proto";
import "ipma/proxy/v1/direction_value.proto";
import "ipma/proxy/v1/district_value.proto";
import "ipma/proxy/v1/fire_risk_class_value.proto";
import "ipma/proxy/v1/forecast_location_value.proto";
import "ipma/proxy/v1/geo_feature_categories.proto";
import "ipma/proxy/v1/geographic_region_value.proto";
import "ipma/proxy/v1/municipality_value.proto";
import "ipma/proxy/v1/precipitation_intensity.proto";
import "ipma/proxy/v1/precipitation_intensity_value.proto";
import "ipma/proxy/v1/seismic_degree_value.proto";
import "ipma/proxy/v1/seismic_magnitude_type_value.proto";
import "ipma/proxy/v1/seismic_source_value.proto";
import "ipma/proxy/v1/station_value.proto";
import "ipma/proxy/v1/uv_period_value.proto";
import "ipma/proxy/v1/warning_area_value.proto";
import "ipma/proxy/v1/warning_level_value.proto";
import "ipma/proxy/v1/warning_type_value.proto";
import "ipma/proxy/v1/weather_type.proto";
import "ipma/proxy/v1/weather_type_value.proto";
import "ipma/proxy/v1/wind_speed_class.proto";
import "ipma/proxy/v1/wind_speed_class_value.proto";

// Read-only access to IPMA's documented public datasets. Missing measurements
// (null, empty strings or IPMA's -99 sentinel) are absent optional fields.
// Unless stated otherwise, times are UTC and coordinates are WGS84 degrees.
// Evolve additively; never reuse removed field numbers or names: reserve them.
service ProxyService {
  // Checks this process is responding; does not contact IPMA.
  rpc Ping(PingRequest) returns (PingResponse);
  // Five days for one location, or all locations for a day offset (0..2).
  rpc GetWeatherForecast(GetWeatherForecastRequest) returns (GetWeatherForecastResponse);
  // Current published warnings, including green entries supplied by IPMA.
  rpc GetWarnings(GetWarningsRequest) returns (GetWarningsResponse);
  // Hourly station measurements over the upstream rolling 24-hour window.
  rpc GetObservations(GetObservationsRequest) returns (GetObservationsResponse);
  // Daily coastal conditions for a day offset (0..2).
  rpc GetSeaForecast(GetSeaForecastRequest) returns (GetSeaForecastResponse);
  // Municipal fire danger for a day offset (0..2).
  rpc GetFireRisk(GetFireRiskRequest) returns (GetFireRiskResponse);
  // All published UV forecasts (up to three days).
  rpc GetUvForecast(GetUvForecastRequest) returns (GetUvForecastResponse);
  // Upstream rolling 30-day seismic catalogue for one region.
  rpc GetSeismicEvents(GetSeismicEventsRequest) returns (GetSeismicEventsResponse);
  // Weather or coastal location reference data.
  rpc GetLocations(GetLocationsRequest) returns (GetLocationsResponse);
  // IPMA numeric codes and bilingual descriptions, including the -99 code.
  rpc GetCodeTable(GetCodeTableRequest) returns (GetCodeTableResponse);
  // GeoJSON encoded as a standalone Mapbox Geobuf Data message.
  rpc GetGeoDataset(GetGeoDatasetRequest) returns (GetGeoDatasetResponse);
  // Daily municipal climate statistics from IPMA's rolling 20-day CSV files.
  rpc GetClimate(GetClimateRequest) returns (GetClimateResponse);
}

message PingRequest {}
message PingResponse {
  string message = 1;
}

// Source and proxy freshness. A fetch time is not an observation time.
message SourceMetadata {
  string source_url = 1;
  google.protobuf.Timestamp fetched_at = 2;
  // Optional source/cache expiry. The IPMA adapter leaves this unset unless
  // IPMA supplies an expiry; a caching gateway may set its own expiry.
  google.protobuf.Timestamp expires_at = 3;
  optional google.protobuf.Timestamp upstream_updated_at = 4;
  string attribution = 5;
}

// A civil date, not an instant at midnight. Month 1..12, day 1..31.
message Date {
  int32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
}
message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message GetWeatherForecastRequest {
  // Required. Select exactly one; day_offset=0 explicitly selects today.
  oneof target {
    uint32 location_id = 1;
    uint32 day_offset = 2;
  }
}
message GetWeatherForecastResponse {
  SourceMetadata metadata = 1;
  repeated WeatherForecast forecasts = 2;
}
message WeatherForecast {
  uint32 location_id = 1;
  Date date = 2;
  Coordinates coordinates = 3;
  optional double minimum_temperature_celsius = 4;
  optional double maximum_temperature_celsius = 5;
  optional double precipitation_probability_percent = 6;
  string prevailing_wind_direction = 7;
  optional int32 weather_type_code = 8;
  optional int32 wind_speed_class = 9;
  optional int32 precipitation_intensity_class = 10;
  // Typed categories preserve the source code/text alongside their enum value.
  WeatherTypeValue weather_type = 11;
  WindSpeedClassValue wind_speed_classification = 12;
  PrecipitationIntensityValue precipitation_intensity = 13;
  DirectionValue wind_direction = 14;
  ForecastLocationValue location = 15;
}

message GetWarningsRequest {}
message GetWarningsResponse {
  SourceMetadata metadata = 1;
  repeated Warning warnings = 2;
}
// Published raw strings remain available; typed values retain unfamiliar sources.
message Warning {
  string area_id = 1;
  string type_name = 2;
  string level = 3;
  string text = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  WarningTypeValue warning_type = 7;
  WarningLevelValue warning_level = 8;
  WarningAreaValue area = 9;
}

message GetObservationsRequest {}
message GetObservationsResponse {
  SourceMetadata metadata = 1;
  // Null station records are omitted. Individual missing measurements are absent.
  repeated Observation observations = 2;
}
message Observation {
  uint32 station_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  optional double temperature_celsius = 3;
  optional double wind_speed_meters_per_second = 4;
  optional double wind_speed_kilometers_per_hour = 5;
  optional int32 wind_direction_code = 6;
  optional double precipitation_millimeters = 7;
  optional double relative_humidity_percent = 8;
  optional double sea_level_pressure_hectopascals = 9;
  optional double solar_radiation_kilojoules_per_square_meter = 10;
  DirectionValue wind_direction = 11;
  StationValue station = 12;
}

message GetSeaForecastRequest {
  // Required, 0=today, 1=tomorrow, 2=day after tomorrow.
  optional uint32 day_offset = 1;
}
message GetSeaForecastResponse {
  SourceMetadata metadata = 1;
  Date date = 2;
  repeated SeaForecast forecasts = 3;
}
message SeaForecast {
  uint32 location_id = 1;
  Coordinates coordinates = 2;
  optional double minimum_wave_period_seconds = 3;
  optional double maximum_wave_period_seconds = 4;
  optional double minimum_swell_height_meters = 5;
  optional double maximum_swell_height_meters = 6;
  optional double minimum_significant_wave_height_meters = 7;
  optional double maximum_significant_wave_height_meters = 8;
  optional double minimum_sea_surface_temperature_celsius = 9;
  optional double maximum_sea_surface_temperature_celsius = 10;
  string prevailing_wave_direction = 11;
  DirectionValue wave_direction = 12;
  ForecastLocationValue location = 13;
}

message GetFireRiskRequest {
  // Required, 0..2.
  optional uint32 day_offset = 1;
}
message GetFireRiskResponse {
  SourceMetadata metadata = 1;
  Date forecast_date = 2;
  Date model_run_date = 3;
  repeated FireRisk risks = 4;
}
message FireRisk {
  // DICO is a string to preserve leading zeroes.
  string municipality_id = 1;
  Coordinates coordinates = 2;
  // 1=reduced, 2=moderate, 3=high, 4=very high, 5=maximum.
  optional int32 risk_class = 3;
  FireRiskClassValue classification = 4;
  MunicipalityValue municipality = 5;
}

message GetUvForecastRequest {}
message GetUvForecastResponse {
  SourceMetadata metadata = 1;
  repeated UvForecast forecasts = 2;
}
message UvForecast {
  // IPMA sometimes supplies 0 for locations without a mapped identifier.
  uint32 location_id = 1;
  Date date = 2;
  optional double index = 3;
  string peak_hour_interval = 4;
  optional int32 period_code = 5;
  UvPeriodValue period = 6;
  ForecastLocationValue location = 7;
}

enum SeismicRegion {
  SEISMIC_REGION_UNSPECIFIED = 0;
  SEISMIC_REGION_AZORES = 1;
  SEISMIC_REGION_MAINLAND_AND_MADEIRA = 2;
}
message GetSeismicEventsRequest {
  SeismicRegion region = 1;
}
message GetSeismicEventsResponse {
  SourceMetadata metadata = 1;
  repeated SeismicEvent events = 2;
}
message SeismicEvent {
  google.protobuf.Timestamp occurred_at = 1;
  Coordinates coordinates = 2;
  optional double magnitude = 3;
  string magnitude_type = 4;
  optional double depth_kilometers = 5;
  string observation_region = 6;
  optional string locality = 7;
  optional string degree = 8;
  string source = 9;
  string shakemap_id = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional string event_id = 12;
  optional bool sensed = 13;
  optional string google_map_reference = 14;
  optional string tensor_reference = 15;
  SeismicMagnitudeTypeValue magnitude_classification = 16;
  SeismicDegreeValue intensity = 17;
  SeismicSourceValue reporting_source = 18;
}

enum LocationKind {
  LOCATION_KIND_UNSPECIFIED = 0;
  LOCATION_KIND_WEATHER = 1;
  LOCATION_KIND_SEA = 2;
}
message GetLocationsRequest {
  LocationKind kind = 1;
}
message GetLocationsResponse {
  SourceMetadata metadata = 1;
  repeated Location locations = 2;
}
message Location {
  uint32 location_id = 1;
  string name = 2;
  Coordinates coordinates = 3;
  string warning_area_id = 4;
  optional uint32 region_id = 5;
  optional uint32 district_id = 6;
  optional uint32 municipality_code = 7;
  optional uint32 local_code = 8;
  ForecastLocationValue location = 9;
  WarningAreaValue warning_area = 10;
  GeographicRegionValue region = 11;
  DistrictValue district = 12;
  MunicipalityValue municipality = 13;
  CoastalLocationValue coastal_location = 14;
}

enum CodeTableKind {
  CODE_TABLE_KIND_UNSPECIFIED = 0;
  CODE_TABLE_KIND_WEATHER_TYPE = 1;
  CODE_TABLE_KIND_WIND_SPEED = 2;
  CODE_TABLE_KIND_PRECIPITATION = 3;
}
message GetCodeTableRequest {
  CodeTableKind kind = 1;
}
message GetCodeTableResponse {
  SourceMetadata metadata = 1;
  repeated CodeEntry entries = 2;
}
message CodeEntry {
  sint32 code = 1;
  string description_portuguese = 2;
  string description_english = 3;
  // The source code and bilingual descriptions accompany one typed category.
  // -99 remains a catalogue entry with UNSPECIFIED value; unfamiliar codes use OTHER.
  oneof classification {
    WeatherType weather_type = 4;
    WindSpeedClass wind_speed_class = 5;
    PrecipitationIntensity precipitation_intensity = 6;
  }
}

enum GeoDataset {
  GEO_DATASET_UNSPECIFIED = 0;
  GEO_DATASET_RECENT_OBSERVATIONS = 1;
  GEO_DATASET_STATIONS = 2;
  GEO_DATASET_BIVALVE_INTERDICTIONS = 3;
}
message GetGeoDatasetRequest {
  GeoDataset dataset = 1;
}
message GetGeoDatasetResponse {
  SourceMetadata metadata = 1;
  // Raw Mapbox Geobuf Data bytes, decodable by geobuf.decode(new Pbf(bytes)).
  // Precision is six decimal places; properties/extensions retain original values
  // including -99. The stations array is wrapped in a FeatureCollection.
  bytes geobuf = 2;
  // Optional typed companions, associated by feature index; Geobuf is unchanged.
  repeated GeoFeatureCategories feature_categories = 3;
}

enum ClimateDataset {
  CLIMATE_DATASET_UNSPECIFIED = 0;
  CLIMATE_DATASET_EVAPOTRANSPIRATION = 1;
  CLIMATE_DATASET_PRECIPITATION = 2;
  CLIMATE_DATASET_TEMPERATURE = 3;
}

enum ClimateMetric {
  CLIMATE_METRIC_UNSPECIFIED = 0;
  // mm per day.
  CLIMATE_METRIC_EVAPOTRANSPIRATION = 1;
  // mm per hour.
  CLIMATE_METRIC_MAXIMUM_PRECIPITATION_RATE = 2;
  // mm per day.
  CLIMATE_METRIC_TOTAL_PRECIPITATION = 3;
  // Celsius.
  CLIMATE_METRIC_MAXIMUM_TEMPERATURE = 4;
  CLIMATE_METRIC_MEAN_TEMPERATURE = 5;
  CLIMATE_METRIC_MINIMUM_TEMPERATURE = 6;
}
message GetClimateRequest {
  ClimateDataset dataset = 1;
}
message GetClimateResponse {
  SourceMetadata metadata = 1;
  repeated ClimateRecord records = 2;
}
message ClimateRecord {
  Date date = 1;
  string municipality_id = 2;
  string municipality_name = 3;
  repeated ClimateStatistics statistics = 4;
  MunicipalityValue municipality = 5;
}
message ClimateStatistics {
  ClimateMetric metric = 1;
  optional double mean = 2;
  optional double standard_deviation = 3;
  optional double minimum = 4;
  optional double maximum = 5;
  optional double percentile_25 = 6;
  optional double median = 7;
  optional double percentile_75 = 8;
}
